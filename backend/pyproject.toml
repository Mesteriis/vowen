[project]
name = "vowen"
version = "0.1.0"
description = "Single-instance private relationship workspace"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "typer>=0.15,<1", "cryptography>=44,<51", "aiogram>=3.19,<4"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]
[build-system]
requires = ["uv_build==0.12.11"]
build-backend = "uv_build"
[project.scripts]
appctl = "vowen.cli.main:app"
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests/unit"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.mypy]
python_version = "3.13"
strict = true
