name: release-artifacts
on:
  workflow_dispatch:
  push:
    branches: [feat/m6]
    tags: ['v*']
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.15'}
      - run: docker buildx create --name vowen-release --driver docker-container --driver-opt image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c --use
      - run: make release-images
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-amd64-release-${{ github.sha }}
          path: artifacts/release/*/images/*
          retention-days: 14
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.15'}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: make release-android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-unsigned-release-${{ github.sha }}
          path: artifacts/release/*/android/*
          retention-days: 14
          if-no-files-found: error
