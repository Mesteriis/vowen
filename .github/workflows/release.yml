name: release-artifacts
on:
  workflow_dispatch:
  push:
    branches: [feat/m6]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md', 'README.ru.md']
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.15'}
      - run: docker buildx create --name vowen-release --driver docker-container --driver-opt image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c --use
      - run: make release-images
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-amd64-release-${{ github.sha }}
          path: artifacts/release/*/images/*
          retention-days: 14
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.15'}
      # setup-java's SemVer parser rejects the four-component security-patch version.
      # Install that exact official archive by checksum through its jdkfile provider.
      - name: Download pinned Temurin 17.0.20.1+1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/temurin17.tar.gz" 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_x64_linux_hotspot_17.0.20.1_1.tar.gz'
          printf '%s  %s\n' '3808d1d15e3ec6bd5b84057fb5d84c33d8a1536a258146bcea2e603fc726e08e' "$RUNNER_TEMP/temurin17.tar.gz" | sha256sum -c -
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: jdkfile
          java-version: '17.0.20'
          jdkFile: ${{ runner.temp }}/temurin17.tar.gz
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: make release-android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-unsigned-release-${{ github.sha }}
          path: artifacts/release/*/android/*
          retention-days: 14
          if-no-files-found: error
