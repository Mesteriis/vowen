name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend-web:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env: {POSTGRES_USER: vowen, POSTGRES_PASSWORD: vowen, POSTGRES_DB: vowen_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vowen -d vowen_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vowen:vowen@127.0.0.1:5432/vowen_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.15'}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with: {version: '0.12.11'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '24.20.0'}
      - run: corepack enable && corepack prepare pnpm@11.5.1 --activate
      - run: make bootstrap migrate-test lint typecheck test test-web build-web check-contracts secret-scan
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: make test-e2e
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f deploy/pve/compose.edge.yaml config --quiet
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: make build-android
