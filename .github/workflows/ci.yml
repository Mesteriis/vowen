name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env: {POSTGRES_USER: vowen, POSTGRES_PASSWORD: vowen, POSTGRES_DB: vowen_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vowen -d vowen_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vowen:vowen@127.0.0.1:5432/vowen_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.15'}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with: {version: '0.12.11'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.20.0'}
      - run: corepack enable && corepack prepare pnpm@11.5.1 --activate
      - run: make bootstrap migrate-test lint typecheck test test-web build-web check-contracts secret-scan
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: make test-e2e
      - run: docker compose config --quiet
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: make build-android
