# Dedicated nginx-ui edge vhost. Certificate lifecycle belongs to nginx-ui.
server {
    listen 80;
    server_name vowen.example.test;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 192.0.2.7;
    real_ip_header CF-Connecting-IP;
    client_max_body_size 12m;
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:9180;
        proxy_set_header Host $host;
    }
    location / {
        if ($http_x_forwarded_proto != "https") { return 301 https://vowen.example.test$request_uri; }
        proxy_pass http://192.0.2.51:80;
        proxy_set_header Host vowen.example.test;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 443 ssl;
    server_name vowen.example.test;
    ssl_certificate /etc/nginx/ssl/vowen.example.test_P256/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/vowen.example.test_P256/private.key;
    client_max_body_size 12m;
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:9180;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://192.0.2.51:80;
        proxy_set_header Host vowen.example.test;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
